title: Abdallah MIRI
email: your-email@example.com
description: "Welcome to my personal website where I share my projects, blog posts, and more about web development."
keywords: "Abdallah MIRI, web developer, portfolio, blog, projects"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://abdallah-miri.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: miri
github_username: abdallah-miri.github.com

timezone: Africa/Cairo
lang: "ar"
directions: "rtl"

# Build settings
theme: miri

plugins:
    - jekyll-admin
    - jekyll-seo-tag
    - jekyll-sitemap
    - jekyll-feed
    - jekyll-paginate-v2
    - jekyll-archives
    - jekyll-toc
    - jekyll-reading-time

jekyll-admin:
  base_path: /admin
  hidden_links: []

permalink: /:title/

jekyll-archives:
  enabled:
    - categories
  layout: "archive_layout"
  permalinks:
    category: "/categories/:name/"

pagination:
  enabled: true
  per_page: 10
  permalink: "/page/:num/"

markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    disable: true
  toc_levels: 1..5
  auto_ids: true

exclude:
  - node_modules
  - package.json
  - tailwind.config.js
  - postcss.config.js
  
reading_time:
  format: "%M %L"
  minute_label: "دقيقة"
  minutes_label: "دقائق"
